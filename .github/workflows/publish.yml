name: Test and release
on:
  push:
    branches: [main]
    paths: [releases/0.3.1.sha256]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: write
    outputs:
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: acceptance-distributions
          path: checked
          run-id: 46012347525
          github-token: ${{ github.token }}
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(basename checked/dist/*.tar.gz .tar.gz)
          version=${version#bornlens-}
          if gh release view "v$version" >/dev/null 2>&1; then
            if [ "$(git ls-remote origin "refs/tags/v$version" | cut -f1)" != "4db29f5c26deb3206a46fb36e21f747fdac54a27" ]; then exit 1; fi
          else
            (cd checked/dist && sha256sum -c ../../releases/0.3.1.sha256)
            gh release create "v$version" checked/dist/* --target "4db29f5c26deb3206a46fb36e21f747fdac54a27" --title "BornLens $version" --notes "Advanced statistical analysis for quantum circuit comparisons. See docs/advanced.md for all 15 functions, examples and assumptions."
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
  publish:
    needs: release
    if: needs.release.outputs.publish == 'true'
    runs-on: ubuntu-22.04
    environment: pypi
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: acceptance-distributions
          path: checked
          run-id: 46012347525
          github-token: ${{ github.token }}
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          packages-dir: checked/dist/
      - uses: actions/checkout@v4
        with:
          path: source
      - name: Verify released bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(basename checked/dist/*.tar.gz .tar.gz)
          gh release download "v${version#bornlens-}" --repo "$GITHUB_REPOSITORY" --dir github-files
          python source/scripts/verify_hashes.py checked/dist github-files "${version#bornlens-}"
