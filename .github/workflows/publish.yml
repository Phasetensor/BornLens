name: Test and release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    uses: ./.github/workflows/validation.yml
  release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: acceptance
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: acceptance-distributions
          path: checked
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(basename checked/dist/*.tar.gz .tar.gz)
          version=${version#bornlens-}
          if gh release view "v$version" >/dev/null 2>&1; then
            if [ "$(git ls-remote origin "refs/tags/v$version" | cut -f1)" != "$GITHUB_SHA" ]; then exit 0; fi
          else
            gh release create "v$version" checked/dist/* --target "$GITHUB_SHA" --title "BornLens $version" --notes "Advanced statistical analysis for quantum circuit comparisons. See docs/advanced.md for all 15 functions, examples and assumptions."
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
  publish:
    needs: release
    if: needs.release.outputs.publish == 'true'
    runs-on: ubuntu-22.04
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: acceptance-distributions
          path: checked
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: checked/dist/
      - uses: actions/checkout@v4
        with:
          path: source
      - name: Verify released bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(basename checked/dist/*.tar.gz .tar.gz)
          gh release download "v${version#bornlens-}" --repo "$GITHUB_REPOSITORY" --dir github-files
          python source/scripts/verify_hashes.py checked/dist github-files "${version#bornlens-}"
