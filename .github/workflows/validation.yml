name: Scientific acceptance
on:
  push:
    branches: [advanced-final-validation, main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  compatibility:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9','3.11','3.12','3.13','3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - if: matrix.python != '3.9'
        run: python -m pip install '.[stats,qiskit]'
      - run: python -m unittest discover -s tests -v
  validation:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[qiskit,stats]' 'shotweave==0.2.0' coverage hypothesis statsmodels ruff mypy build twine
      - name: Types
        run: mypy bornlens
      - name: Coverage
        if: success() || failure()
        run: |
          coverage run --branch --source=bornlens -m unittest discover -s tests -v
          coverage json
          coverage report -m
          python scripts/coverage_gate.py
      - name: Lint
        if: success() || failure()
        run: ruff check .
      - name: Format
        if: success() || failure()
        run: ruff format --check .
      - name: Scientific smoke
        if: success() || failure()
        run: python benchmarks/validate.py --smoke --out /tmp/smoke
      - name: Distributions
        if: success() || failure()
        run: |
          python -m build
          twine check --strict dist/*
          export BORNLENS_GUIDE="$PWD/docs/advanced.md"
          for pkg in dist/*; do
            python -m venv --clear /tmp/bornlens-acceptance
            /tmp/bornlens-acceptance/bin/pip install "$pkg[stats,qiskit]"
            (cd /tmp && /tmp/bornlens-acceptance/bin/python -I -c 'from bornlens.advanced import compare_many; from bornlens.qiskit import compare_circuits')
            (cd /tmp && /tmp/bornlens-acceptance/bin/python -I -c 'import os, re; from pathlib import Path; blocks = re.findall(r"```python\n(.*?)```", Path(os.environ["BORNLENS_GUIDE"]).read_text(), re.S); assert len(blocks) == 2; exec("\n".join(blocks))')
          done
          tar tzf dist/*.tar.gz | grep '/benchmarks/acceptance/metrics.csv$'
          unzip -l dist/*.whl | grep bornlens/py.typed
          sha256sum dist/*
      - uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: acceptance-distributions
          path: |
            dist/
            coverage.json
