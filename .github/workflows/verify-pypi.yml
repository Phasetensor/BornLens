name: Verify public installation
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Test and release"]
    types: [completed]
permissions:
  contents: read
jobs:
  install:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m venv /tmp/bornlens-public
          /tmp/bornlens-public/bin/pip install --no-cache-dir --index-url https://pypi.org/simple 'bornlens[stats]==0.3.0'
          /tmp/bornlens-public/bin/python -I -c 'from bornlens import shots_per_circuit; assert shots_per_circuit(0.05) == 5903'
          /tmp/bornlens-public/bin/python -I -c 'from bornlens.advanced import adjust_pvalues; assert adjust_pvalues([0.01], "holm") == [0.01]'
