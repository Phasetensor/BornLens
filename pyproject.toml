[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bornlens"
version = "0.3.0"
description = "Finite-shot comparisons of Pauli expectations"
requires-python = ">=3.9"
readme = "README.md"
license = "Apache-2.0"

[project.optional-dependencies]
qiskit = ["qiskit>=2.6,<3"]
stats = ["scipy>=1.9"]

[tool.setuptools]
packages = ["bornlens"]

[tool.setuptools.package-data]
bornlens = ["py.typed"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
