[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bornlens"
version = "0.2.0"
description = "Finite-shot comparisons of Pauli expectations"
requires-python = ">=3.9"
readme = "README.md"
license = "Apache-2.0"

[project.optional-dependencies]
qiskit = ["qiskit>=2.6,<3"]
stats = ["scipy>=1.9"]

[tool.setuptools]
packages = ["bornlens"]
